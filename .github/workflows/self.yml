# release-kit's own CI, through the same reusable workflow every app calls. The pr-title checker comes from the branch under review, not from v1.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-node.yml
    with:
      check-commands: |
        npm run typecheck
        npm test
      kit-ref: ${{ github.head_ref || github.ref_name }}

  # The kit releases itself through the reusable workflow it ships. The concurrency group above cancels in-progress runs; for the kit that is accepted on
  # purpose: a cancelled run leaves at worst a pushed tag without its Release, which the next run repairs.
  release:
    if: github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: read
    uses: ./.github/workflows/release.yml
    with:
      kit-ref: ${{ github.ref_name }}

  # After every push's release, one bump PR per app that is behind the newest kit tag (README §Bump PRs). Idempotent, so it runs on every push and needs no
  # "did this run release?" signal; it is skipped with release on a pull_request. futin/ui-kit joins the list once that repo exists and BUMP_TOKEN covers it.
  bump:
    needs: release
    if: github.event_name == 'push'
    uses: ./.github/workflows/bump-consumers.yml
    with:
      package: release-kit
      repository: futin/release-kit
      consumers: |
        futin/claude-agents-dashboard
        futin/backlog-manager
        futin/guide-manager
      kit-ref: ${{ github.ref_name }}
    secrets:
      token: ${{ secrets.BUMP_TOKEN }}
