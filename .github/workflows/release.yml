# Reusable release workflow: tags the unreleased feat|fix|perf PRs merged to main and publishes the GitHub Release (README §Adopting releases).
# `mode: per-pr` (default) tags each PR as its push lands; `mode: rollup` cuts one tag for every releasable PR since the last tag and is meant to run from a
# `schedule` or `workflow_dispatch` caller (README §Adopting rollup releases).
# Two rules hold it together:
#   - a PR title, body or release note never appears inside `run:` through `${{ }}` — they reach `gh` and `git` only as argv elements or files read by
#     the CLI, so text such as `$(id)` stays text;
#   - the permissions are `contents: write` (tag push, Release) and `pull-requests: read`; setting `contents` alone drops `pull-requests` to none, and the
#     PR lookup then fails on a private repo.
name: release

on:
  workflow_call:
    inputs:
      sha:
        description: The commit to release up to; the caller's push sha when empty.
        type: string
        default: ''
      kit-ref:
        description: The release-kit ref the CLI is taken from; keep it equal to the caller's uses ref.
        type: string
        default: v1
      node-version:
        type: string
        default: '22'
      mode:
        description: per-pr tags each releasable PR; rollup cuts one tag for every releasable PR in the range (README §Adopting rollup releases).
        type: string
        default: per-pr

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          # The range is every first-parent commit since the newest version tag, and describe has to see the tags.
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: futin/release-kit
          ref: ${{ inputs.kit-ref }}
          path: .release-kit
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ inputs.node-version }}
          # v5 defaults this on, and it then looks for the packageManager binary (pnpm) before corepack has installed it.
          package-manager-cache: false
      - name: Tagger identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Release
        env:
          TARGET_SHA: ${{ inputs.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ inputs.mode }}
          # A dispatch sha off the default branch is refused; the engine compares it with origin/<this>. A schedule carries no repository payload but always
          # runs on the default branch, so the ref name stands in.
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: node .release-kit/dist/esm/release-cli.js
