<div class="bx-panel">
  <label><input type="checkbox" id="bx-on"> Bionic reading</label>
  <button type="button" class="bx-more" aria-expanded="false" aria-controls="bx-opts" aria-label="Options">Options</button>
  <div id="bx-opts" hidden>
    <label>Fixation
      <input type="range" id="bx-strength" min="20" max="80" step="5" value="50" disabled>
      <output id="bx-strength-out" for="bx-strength" aria-live="off">50%</output>
    </label>
    <label>Every
      <input type="range" id="bx-freq" min="1" max="5" step="1" value="1" disabled>
      <output id="bx-freq-out" for="bx-freq" aria-live="off">1st</output> word
    </label>
  </div>
</div>
